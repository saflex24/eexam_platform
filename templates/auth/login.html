{% extends "base.html" %}

{% block title %}Login - E-Exam Platform{% endblock %}

{% block content %}

<style>
body {
    background: linear-gradient(-45deg, #1d2671, #c33764, #1d2671, #0f2027);
    background-size: 400% 400%;
    animation: gradientBG 12s ease infinite;
    height: 100vh;
}

@keyframes gradientBG {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.login-card-wrapper {
    position: relative;
}

/* ── SOLID DARK NAVY CARD ── */
.login-card {
    background: #0d1b3e;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    animation: fadeSlide 1s ease;
    color: #e8eaf6;
    overflow: hidden;
}

@keyframes fadeSlide {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0);    }
}

.login-card .text-light {
    color: #8fa3c8 !important;
}

/* ── INPUTS ── */
.form-control {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #e8eaf6;
    border-radius: 10px;
}
.form-control::placeholder {
    color: rgba(255, 255, 255, 0.3);
}
.form-control:focus {
    background: rgba(255, 255, 255, 0.10);
    color: #ffffff;
    border-color: #00f2fe;
    box-shadow: 0 0 0 3px rgba(0, 242, 254, 0.18);
    outline: none;
}

.form-label {
    color: #8fa3c8;
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 0.4rem;
}

.form-check-label { color: #8fa3c8; }
.form-check-input:checked {
    background-color: #00c6ff;
    border-color: #00c6ff;
}

/* ── LOGIN BUTTON ── */
.btn-login {
    background: linear-gradient(135deg, #00f2fe, #4facfe);
    border: none;
    color: #0d1b3e;
    font-weight: 700;
    letter-spacing: 0.03em;
    border-radius: 10px;
    transition: all 0.3s ease;
}
.btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(0, 242, 254, 0.45);
    color: #0d1b3e;
}
.btn-login:disabled { opacity: 0.75; }

.login-card hr { border-color: rgba(255, 255, 255, 0.12); }

a { color: #00f2fe; }
a:hover { color: #4facfe; }

/* ── ERROR OVERLAY ── */
.login-error-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255, 0, 0, 0.06);
    border-radius: 20px;
    pointer-events: none;
    z-index: 5;
    transition: opacity 0.3s;
    opacity: 0;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60%  { transform: translateX(-8px); }
    40%, 80%  { transform: translateX(8px); }
}
.shake { animation: shake 0.6s ease; }

@keyframes pulse {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.05); }
    100% { transform: scale(1); }
}
.animate__pulse { animation: pulse 0.6s ease-in-out infinite; }

/* ── PASSWORD TOGGLE ── */
.password-wrapper {
    position: relative;
}
.password-wrapper .form-control {
    padding-right: 3rem;
}
.btn-eye {
    position: absolute;
    top: 50%;
    right: 0.75rem;
    transform: translateY(-50%);
    background: none;
    border: none;
    padding: 0;
    color: #8fa3c8;
    cursor: pointer;
    line-height: 1;
    transition: color 0.2s ease;
    z-index: 10;
}
.btn-eye:hover { color: #00f2fe; }
.btn-eye svg  { width: 20px; height: 20px; display: block; }
</style>

<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh;">
    <div class="col-md-6 col-lg-4">
        <div class="login-card-wrapper">
            <div class="card login-card p-4">
                <div class="card-body">

                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-white">🎓 E-Exam Platform</h2>
                        <p class="text-light">Sign in to your account</p>
                    </div>

                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control form-control-lg" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <div class="password-wrapper">
                                <input type="password" name="password" id="passwordInput" class="form-control form-control-lg" required>
                                <button type="button" class="btn-eye" id="togglePassword" aria-label="Toggle password visibility">
                                    <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                    <svg id="eyeOffIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                        <line x1="1" y1="1" x2="23" y2="23"/>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" name="remember" id="remember">
                            <label class="form-check-label" for="remember">Remember me</label>
                        </div>

                        <button type="submit" class="btn btn-login btn-lg w-100" id="loginBtn">
                            <i class="fas fa-sign-in-alt"></i>
                            <span class="btn-text">Login</span>
                            <span class="spinner-border spinner-border-sm ms-2 d-none" role="status" id="loginSpinner"></span>
                        </button>
                    </form>

                    {% if enrollment_open %}
                    <hr>

                    <p class="text-center" style="color:#8fa3c8;">
                        Don't have an account?
                        <a href="{{ url_for('auth.register') }}">Register here</a>
                    </p>
                    {% endif %}

                </div>
            </div>
            <div class="login-error-overlay d-none"></div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const loginForm = document.querySelector('form');
    const loginBtn  = document.getElementById('loginBtn');
    const spinner   = document.getElementById('loginSpinner');
    const btnText   = loginBtn.querySelector('.btn-text');
    const wrapper   = document.querySelector('.login-card-wrapper');
    const overlay   = document.querySelector('.login-error-overlay');

    // Password toggle
    const passwordInput = document.getElementById('passwordInput');
    const togglePassword = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeOffIcon = document.getElementById('eyeOffIcon');

    togglePassword.addEventListener('click', function () {
        const isHidden = passwordInput.type === 'password';
        passwordInput.type = isHidden ? 'text' : 'password';
        eyeIcon.style.display    = isHidden ? 'none'  : 'block';
        eyeOffIcon.style.display = isHidden ? 'block' : 'none';
        passwordInput.focus();
    });

    loginForm.addEventListener('submit', function () {
        loginBtn.disabled = true;
        spinner.classList.remove('d-none');
        btnText.textContent = 'Signing In…';
        loginBtn.classList.add('animate__pulse');
    });

    {% if error %}
        loginBtn.disabled = false;
        spinner.classList.add('d-none');
        btnText.textContent = 'Login';
        overlay.classList.remove('d-none');
        overlay.style.opacity = 1;
        wrapper.classList.add('shake');
        setTimeout(() => {
            wrapper.classList.remove('shake');
            overlay.style.opacity = 0;
            setTimeout(() => overlay.classList.add('d-none'), 300);
        }, 600);
    {% endif %}
});
</script>

{% endblock %}
