{% extends "base.html" %}

{% block title %}Register - E-Exam Platform{% endblock %}

{% block content %}

<style>
body {
    background: linear-gradient(-45deg, #1d2671, #c33764, #1d2671, #0f2027);
    background-size: 400% 400%;
    animation: gradientBG 12s ease infinite;
}

@keyframes gradientBG {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.register-card-wrapper {
    position: relative;
}

.register-card {
    background: #0d1b3e;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    animation: fadeSlide 1s ease;
    color: #e8eaf6;
    overflow: hidden;
}

@keyframes fadeSlide {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0);    }
}

.register-card .text-light {
    color: #8fa3c8 !important;
}

.form-control, .form-select {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #e8eaf6;
    border-radius: 10px;
}
.form-control::placeholder {
    color: rgba(255, 255, 255, 0.3);
}
.form-control:focus, .form-select:focus {
    background: rgba(255, 255, 255, 0.10);
    color: #ffffff;
    border-color: #00f2fe;
    box-shadow: 0 0 0 0.2rem rgba(0, 242, 254, 0.15);
}
.form-select option {
    color: #0d1b3e;
}
.form-label {
    color: #c9d3ec;
    font-weight: 500;
}

.btn-register {
    background: linear-gradient(90deg, #00f2fe, #4facfe);
    border: none;
    color: #0d1b3e;
    font-weight: 700;
}
.btn-register:hover {
    filter: brightness(1.05);
    color: #0d1b3e;
}
</style>

<div class="container d-flex justify-content-center align-items-center py-5" style="min-height:100vh;">
    <div class="col-md-8 col-lg-6">
        <div class="register-card-wrapper">
            <div class="card register-card p-4">
                <div class="card-body">

                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-white">🎓 Student Registration</h2>
                        <p class="text-light">Create your account to get started</p>
                    </div>

                    <form method="POST" action="{{ url_for('auth.register') }}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">First Name</label>
                                <input type="text" name="first_name" class="form-control"
                                       value="{{ form.first_name or '' }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Last Name</label>
                                <input type="text" name="last_name" class="form-control"
                                       value="{{ form.last_name or '' }}" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Admission Number</label>
                                <input type="text" name="admission_number" class="form-control"
                                       value="{{ form.admission_number or '' }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Class</label>
                                <select name="class_id" class="form-select" required>
                                    <option value="" disabled {{ 'selected' if not form.class_id else '' }}>Select your class</option>
                                    {% for c in classes %}
                                    <option value="{{ c.id }}" {{ 'selected' if form.class_id|string == c.id|string else '' }}>{{ c.full_name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email <span class="text-light" style="font-weight:400;">(optional)</span></label>
                                <input type="email" name="email" class="form-control"
                                       value="{{ form.email or '' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Gender</label>
                                <select name="gender" class="form-select">
                                    <option value="Male" {{ 'selected' if form.gender == 'Male' else '' }}>Male</option>
                                    <option value="Female" {{ 'selected' if form.gender == 'Female' else '' }}>Female</option>
                                    <option value="Other" {{ 'selected' if form.gender == 'Other' else '' }}>Other</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control"
                                   value="{{ form.username or '' }}" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" minlength="6" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" name="confirm_password" class="form-control" minlength="6" required>
                            </div>
                        </div>
                        <p class="text-light small mb-4">
                            Password must be at least 6 characters long.
                        </p>

                        <button type="submit" class="btn btn-register btn-lg w-100" id="registerBtn">
                            <i class="fas fa-user-plus"></i>
                            <span class="btn-text">Create Account</span>
                            <span class="spinner-border spinner-border-sm ms-2 d-none" role="status" id="registerSpinner"></span>
                        </button>
                    </form>

                    <hr>
                    <p class="text-center" style="color:#8fa3c8;">
                        Already have an account?
                        <a href="{{ url_for('auth.login') }}">Log in here</a>
                    </p>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const registerForm = document.querySelector('form');
    const registerBtn   = document.getElementById('registerBtn');
    const spinner        = document.getElementById('registerSpinner');
    const btnText         = registerBtn.querySelector('.btn-text');

    registerForm.addEventListener('submit', function () {
        // Prevent double-submit (double-click, Enter+click, etc.) from
        // firing two POSTs for the same account.
        if (registerBtn.disabled) {
            return false;
        }
        registerBtn.disabled = true;
        spinner.classList.remove('d-none');
        btnText.textContent = 'Creating account...';
    });
});
</script>

{% endblock %}
